name: uv-upsync
description: Upgrade dependency lower bounds in pyproject.toml to the latest versions
author: pivoshenko
branding:
  icon: arrow-up-circle
  color: purple

inputs:
  args:
    description: Additional arguments passed to uv-upsync (e.g. "--check --all-groups")
    required: false
    default: ""
  version:
    description: Version of uv-upsync to run (defaults to the latest release)
    required: false
    default: ""
  working-directory:
    description: Directory to run uv-upsync in
    required: false
    default: "."

outputs:
  summary:
    description: The upgrade summary printed by uv-upsync (pass `--format markdown` for a PR body)
    value: ${{ steps.upsync.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Run uv-upsync
      id: upsync
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        summary="$(uvx ${{ inputs.version != '' && format('uv-upsync@{0}', inputs.version) || 'uv-upsync' }} ${{ inputs.args }})"
        status=$?
        printf '%s\n' "$summary"
        {
          printf 'summary<<UPSYNC_EOF\n'
          printf '%s\n' "$summary"
          printf 'UPSYNC_EOF\n'
        } >> "$GITHUB_OUTPUT"
        exit "$status"
